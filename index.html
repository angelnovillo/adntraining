<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#08111f" />
  <title>ADN Training · Plan semanal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="app">
    <header>
      <div>
        <p class="eyebrow">ADN Training · Plan híbrido</p>
        <h1>Entrena con intención</h1>
      </div>
      <button class="today-btn" id="todayBtn">Hoy</button>
    </header>

    <section id="phaseCard"></section>
    <nav class="week" id="week" aria-label="Días de la semana"></nav>

    <section class="nav" aria-label="Navegación por días">
      <button id="prevBtn" aria-label="Día anterior">‹</button>
      <div class="date"><strong id="dateTitle"></strong><span id="dateSub"></span></div>
      <button id="nextBtn" aria-label="Día siguiente">›</button>
    </section>

    <section class="hero" id="hero"></section>

    <section>
      <div class="section-title"><h3>Plan de hoy</h3><span id="effort"></span></div>
      <div class="session-list" id="sessions"></div>
    </section>

    <section id="gymSection"></section>

    <section>
      <div class="section-title"><h3>Cumplimiento</h3><span>Se guarda en este dispositivo</span></div>
      <div class="completion" id="completion"></div>
    </section>

    <section id="nutrition"></section>
    <section id="weeklySummary"></section>

    <p class="footer">Plan práctico y progresivo. Las estimaciones nutricionales no sustituyen seguimiento médico o dietético, especialmente ante molestias digestivas.</p>
  </main>
  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
